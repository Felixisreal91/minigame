<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>J's 미니게임</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <!-- 랜딩 화면 -->
    <section id="landing-screen">
      <header class="hero">
        <h1>J's 미니게임</h1>
        <p>아이스 브레이킹용 미니게임</p>
      </header>

      <div class="card">
        <h2>호스트로 시작하기</h2>
        <p class="desc">새 방을 만들고 참가자를 초대하세요.</p>
        <button id="create-room-btn" class="primary">새 방 만들기</button>
      </div>

      <div class="card">
        <h2>참가자로 입장하기</h2>
        <p class="desc">호스트에게 받은 코드 4자리를 입력하세요.</p>
        <input id="join-code-input" type="text" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" />
        <input id="join-nickname-input" type="text" maxlength="12" placeholder="닉네임을 입력하세요" />
        <button id="join-room-btn" class="primary">참가자로 입장하기</button>
        <p id="join-error" class="error-text"></p>
      </div>
    </section>

    <!-- 참가자 대기 화면 -->
    <section id="waiting-screen" class="hidden">
      <div class="center-block">
        <div class="spinner"></div>
        <div>
          <p id="waiting-nickname" style="font-size:1.1rem; font-weight:700; margin: 0 0 6px;"></p>
          <p id="waiting-message" class="desc" style="margin:0;">호스트가 게임을 시작하길 기다리는 중...</p>
        </div>
      </div>
    </section>

    <!-- 게임 화면: 7초 맞히기 -->
    <section id="game-screen" class="hidden">
      <header class="hero">
        <h1>7초 맞히기</h1>
        <p>스톱워치를 정확히 7.00초에 맞춰보세요!</p>
      </header>

      <div id="game-ready" class="center-block">
        <p id="game-ready-message" class="desc">호스트가 시작하면 카운트다운이 시작돼요</p>
      </div>

      <div id="game-countdown" class="center-block hidden">
        <div class="room-code" id="game-countdown-number">3</div>
      </div>

      <div id="game-stopwatch" class="center-block hidden">
        <div class="room-code" id="game-stopwatch-time">0.00</div>
        <button id="game-stop-btn" class="primary">정지</button>
      </div>

      <div id="game-result" class="hidden">
        <div class="card" style="align-items:center; text-align:center;">
          <p class="desc" style="margin:0;">내 기록</p>
          <div class="room-code" id="game-my-result">-</div>
        </div>
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>실시간 순위</h2>
            <span class="participant-count" id="game-leaderboard-count"></span>
          </div>
          <ul class="participant-list" id="game-leaderboard-list"></ul>
        </div>
      </div>
    </section>

    <!-- 게임 화면: 눈치게임 -->
    <section id="nunchi-screen" class="hidden">
      <header class="hero">
        <h1>눈치게임</h1>
        <p>다른 사람보다 먼저 누르세요! 마지막에 누르면 집니다</p>
      </header>

      <div id="nunchi-ready" class="center-block">
        <p id="nunchi-ready-message" class="desc">호스트가 시작하면 카운트다운이 시작돼요</p>
      </div>

      <div id="nunchi-countdown" class="center-block hidden">
        <div class="room-code" id="nunchi-countdown-number">3</div>
      </div>

      <div id="nunchi-press" class="center-block hidden">
        <button id="nunchi-press-btn" class="primary press-btn">누르기</button>
        <p id="nunchi-press-status" class="desc"></p>
      </div>

      <div id="nunchi-reveal" class="hidden">
        <div class="card">
          <h2>결과 공개</h2>
          <ul class="participant-list" id="nunchi-reveal-list"></ul>
        </div>
      </div>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
